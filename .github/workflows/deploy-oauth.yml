name: deploy-workbus-oauth

on:
  push:
    branches:
      - feat/shared-oauth-chatgpt-claude
    paths:
      - "packages/workbus/**"
      - ".github/workflows/deploy-oauth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/shared-oauth-chatgpt-claude'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter ./packages/workbus
      - name: Typecheck
        working-directory: packages/workbus
        run: pnpm exec tsc --noEmit -p .
      - name: OAuth and Worker tests
        working-directory: packages/workbus
        run: pnpm exec vitest run
      - name: Deploy Worker and additive Durable Object migration
        working-directory: packages/workbus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3b1f46dadfa55717a1a4413ab67d3e96"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          pnpm exec wrangler deploy --config wrangler.jsonc
